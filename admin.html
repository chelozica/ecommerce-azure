<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos — básico da villa</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="básico da villa — início">
            <svg viewBox="0 0 36 40" aria-hidden="true">
                <path d="M6 38V17a12 12 0 0 1 24 0v21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M2 38h32" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>básico da villa</span>
        </a>
        <nav class="nav" aria-label="Admin">
            <a href="admin.html" aria-current="page">Pedidos</a>
            <a href="index.html">Ver loja</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="page-title">
        <h1>Pedidos</h1>
        <p id="user"></p>
    </section>

    <div class="stats">
        <div class="stat"><div class="stat-label">Pedidos</div><div class="stat-value" id="stat-count">—</div></div>
        <div class="stat"><div class="stat-label">Faturamento</div><div class="stat-value" id="stat-revenue">—</div></div>
        <div class="stat"><div class="stat-label">A preparar</div><div class="stat-value" id="stat-pending">—</div></div>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <select id="status-filter" class="select" onchange="loadOrders()" aria-label="Filtrar por status">
                <option value="">Todos os status</option>
            </select>
            <button class="btn btn-ghost btn-small" onclick="loadOrders()">Atualizar</button>
        </div>
    </div>

    <div id="orders"><p class="muted">Carregando...</p></div>
</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <span>© 2026 básico da villa · admin</span>
        <a href="/.auth/logout?post_logout_redirect_uri=/index.html">Sair</a>
    </div>
</footer>

<script src="cart.js"></script>
<script src="site.js"></script>
<script>
    let statusLabels = {};

    function formatDate(iso) {
        return new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    }

    function fillStatusFilter(statuses) {
        const select = document.getElementById("status-filter");
        if (select.options.length > 1) return;
        Object.entries(statuses).forEach(([value, label]) => select.add(new Option(label, value)));
    }

    async function showUser() {
        const response = await fetch("/.auth/me");
        const { clientPrincipal } = await response.json();
        if (clientPrincipal) {
            document.getElementById("user").textContent = `Conectado como ${clientPrincipal.userDetails}`;
        }
    }

    function renderHistory(order) {
        const entries = (order.history || []).map(h => `
            <li>${escapeHtml(formatDate(h.at))} · ${escapeHtml(statusLabels[h.from] || "—")} → 
            ${escapeHtml(statusLabels[h.to] || h.to)} <span class="muted">(${escapeHtml(h.by)})</span></li>
        `).join("");
        return entries ? `<details><summary>Histórico</summary><ul>${entries}</ul></details>` : "";
    }

    function renderActions(order) {
        if (order.nextStatuses.length === 0) return '<span class="muted">Finalizado</span>';
        return order.nextStatuses.map(s => `
            <button class="btn ${s.value === "cancelado" ? "btn-ghost" : "btn-primary"} btn-small"
                onclick="changeStatus('${escapeHtml(order.id)}', '${escapeHtml(s.value)}')">${escapeHtml(s.label)}</button>
        `).join("");
    }

    function renderStats(orders) {
        const active = orders.filter(o => o.status !== "cancelado");
        document.getElementById("stat-count").textContent = orders.length;
        document.getElementById("stat-revenue").textContent = formatPrice(active.reduce((s, o) => s + o.total, 0));
        document.getElementById("stat-pending").textContent = orders.filter(o => ["pago", "em_separacao"].includes(o.status)).length;
    }

    async function loadOrders() {
        const container = document.getElementById("orders");
        const filter = document.getElementById("status-filter").value;

        const url = filter ? `/api/orders?status=${encodeURIComponent(filter)}` : "/api/orders";
        const response = await fetch(url);
        if (!response.ok) {
            container.innerHTML = `<p class="muted">Erro ao carregar pedidos (HTTP ${response.status}).</p>`;
            return;
        }

        const data = await response.json();
        statusLabels = data.statuses;
        fillStatusFilter(data.statuses);
        const orders = data.orders;
        renderStats(orders);

        if (orders.length === 0) {
            container.innerHTML = '<div class="empty-state"><p>Nenhum pedido encontrado.</p></div>';
            return;
        }

        const rows = orders.map(o => `
            <tr>
                <td>${escapeHtml(formatDate(o.createdAt))}<br><span class="mono">#${escapeHtml(o.id.slice(0, 8))}</span></td>
                <td>${o.items.map(i => `${i.quantity}× ${escapeHtml(i.name)}`).join("<br>")}</td>
                <td>${formatPrice(o.total)}</td>
                <td>
                    <span class="status ${escapeHtml(o.status)}">${escapeHtml(o.statusLabel)}</span>
                    ${o.trackingCode ? `<div class="mono" style="margin-top:8px">${escapeHtml(o.trackingCode)}</div>` : ""}
                    ${renderHistory(o)}
                </td>
                <td><div class="actions">${renderActions(o)}</div></td>
            </tr>
        `).join("");

        container.innerHTML = `
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr><th>Pedido</th><th>Itens</th><th>Total</th><th>Status</th><th>Ações</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
    }

    async function changeStatus(orderId, newStatus) {
        const label = statusLabels[newStatus];
        const body = { status: newStatus };

        if (newStatus === "enviado") {
            const code = prompt("Código de rastreio:");
            if (!code) return;
            body.trackingCode = code;
        } else if (!confirm(`Mudar o pedido #${orderId.slice(0, 8)} para "${label}"?`)) {
            return;
        }

        const response = await fetch(`/api/orders/${encodeURIComponent(orderId)}/status`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        const result = await response.json().catch(() => ({}));

        if (response.ok) {
            showToast(result.message || "Pedido atualizado");
        } else {
            showToast(result.message || `Erro (HTTP ${response.status})`, "error");
        }
        loadOrders();
    }

    showUser();
    loadOrders();
</script>
</body>
</html>
