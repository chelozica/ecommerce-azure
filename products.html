<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coleção — básico da villa</title>
    <meta name="description" content="básico da villa — peças essenciais, atemporais e descomplicadas.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body><header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="básico da villa — início">
            <svg viewBox="0 0 36 40" aria-hidden="true">
                <path d="M6 38V17a12 12 0 0 1 24 0v21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M2 38h32" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>básico da villa</span>
        </a>
        <nav class="nav" aria-label="Principal">
            <a href="products.html" aria-current="page">Coleção</a>
            <a href="cart.html" class="cart-link">Sacola <span class="cart-count" data-cart-count hidden>0</span></a>
        </nav>
    </div>
</header>
<main class="container">
    <section class="page-title">
        <h1>Coleção</h1>
        <p>Peças essenciais para o dia a dia.</p>
    </section>

    <div class="product-grid" id="product-list">
        <p class="muted">Carregando...</p>
    </div>
</main>
<footer class="site-footer">
    <div class="container footer-inner">
        <span>© 2026 básico da villa</span>
        <span id="auth-area"><a href="/.auth/login/github?post_login_redirect_uri=/index.html">Entrar</a></span>
    </div>
</footer>

<script src="cart.js"></script>
<script src="site.js"></script><script>
    fetchProducts()
        .then(products => {
            document.getElementById("product-list").innerHTML = products.map(renderProductCard).join("");
        })
        .catch(() => {
            document.getElementById("product-list").innerHTML = '<p class="muted">Não foi possível carregar os produtos.</p>';
        });
</script>
</body>
</html>
